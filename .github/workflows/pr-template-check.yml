name: PR Template Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-template:
    runs-on: ubuntu-latest

    steps:
      # The default checkout is the merge of the pull request into its base (refs/pull/N/merge),
      # so the validator and the co-change index come from the base branch (or from the pull
      # request when it changes them), even for a branch created before this check existed.
      # The diff is still the pull request's own: base and head SHAs come from the event payload.
      # Full history: the index and its reproducibility check read it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make sure the base and head commits are available
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate PR description template
        run: node scripts/check-pr-template.mjs

      # The index is generated by `pnpm impact:index`; editing it by hand would silence a partner,
      # and regenerating it at an old commit would empty it, so it must also be recent enough.
      - name: Check the co-change index reproduces
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'scripts/impact-cochange-index.json'; then
            node scripts/impact-index.mjs --check --base "$BASE_SHA"
          else
            echo "The co-change index is not part of this pull request."
          fi
