name: PR Template Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-template:
    runs-on: ubuntu-latest

    steps:
      # Full history: the co-change index and its reproducibility check read it. The head commit
      # is checked out (not the merge commit) so the working tree is the pull request's own.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate PR description template
        run: node scripts/check-pr-template.mjs

      # The index is generated by `pnpm impact:index`; editing it by hand would silence a partner.
      - name: Check the co-change index reproduces
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'scripts/impact-cochange-index.json'; then
            node scripts/impact-index.mjs --check
          else
            echo "The co-change index is not part of this pull request."
          fi
