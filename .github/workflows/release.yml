name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false
      tag_name:
        required: true
        type: string
      target_commitish:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build release artifacts without publishing a GitHub release
        required: false
        type: boolean
        default: false
      tag_name:
        description: Tag to release (e.g. v0.2.0 or v0.2.0-nightly.20260321.1)
        required: true
        type: string
      target_commitish:
        description: Commit-ish to tag (branch or SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

env:
  OPENCOVE_RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
  OPENCOVE_RELEASE_TARGET: ${{ inputs.target_commitish || github.sha }}

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            build_command: pnpm build:mac:arm64
            artifact_name: macos-arm64
            upload_updater_metadata: false
          - label: macOS Intel
            runner: macos-15-intel
            build_command: pnpm build:mac:x64
            artifact_name: macos-x64
            upload_updater_metadata: false
          - label: Windows
            runner: windows-2022
            build_command: pnpm build:win
            artifact_name: windows
            upload_updater_metadata: true
          - label: Linux
            runner: ubuntu-latest
            build_command: pnpm build:linux
            artifact_name: linux
            upload_updater_metadata: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OPENCOVE_RELEASE_TARGET }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align package version with release tag
        run: node scripts/apply-ci-release-version.mjs "${{ env.OPENCOVE_RELEASE_TAG }}"

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.build_command }}

      - name: Build standalone server bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Linux natives must be compiled against an old glibc, otherwise they only load on
          # distributions at least as new as this runner. manylinux_2_28 pairs a glibc 2.28 base
          # with a modern gcc, which better-sqlite3's -std=c++20 requires. 2.28 is also exactly
          # what the bundled Node binary itself requires, so it is the bundle's natural floor.
          OPENCOVE_NATIVE_BUILD_IMAGE: ${{ matrix.artifact_name == 'linux' && 'quay.io/pypa/manylinux_2_28_x86_64' || '' }}
        run: pnpm build:standalone:asset

      - name: Smoke standalone server install (macOS)
        if: startsWith(matrix.artifact_name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find dist -maxdepth 1 -name 'opencove-server-*.tar.gz' -print -quit)"
          test -n "$asset"
          node scripts/generate-checksums.mjs dist
          export OPENCOVE_STANDALONE_ASSET="$asset"
          export OPENCOVE_STANDALONE_CHECKSUMS_FILE="$PWD/dist/SHA256SUMS.txt"
          export OPENCOVE_INSTALL_ROOT="$RUNNER_TEMP/opencove-standalone"
          export OPENCOVE_BIN_DIR="$RUNNER_TEMP/opencove-bin"
          sh scripts/release-assets/opencove-install.sh
          "$OPENCOVE_BIN_DIR/opencove" worker start --help
          sh scripts/release-assets/opencove-install.sh --uninstall

      - name: Smoke standalone server in minimal Linux container
        if: matrix.artifact_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find dist -maxdepth 1 -name 'opencove-server-linux-*.tar.gz' -print -quit)"
          test -n "$asset"
          node scripts/generate-checksums.mjs dist
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            debian:bookworm-slim \
            sh scripts/smoke-standalone-node-runtime.sh "/workspace/$asset"

      - name: Smoke standalone server install (Windows)
        if: matrix.artifact_name == 'windows'
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path dist -Filter 'opencove-server-*.zip' | Select-Object -First 1
          if ($null -eq $asset) {
            throw 'Standalone Windows asset was not produced.'
          }
          $checksumFile = Join-Path $env:RUNNER_TEMP 'opencove-standalone-SHA256SUMS.txt'
          $assetHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumFile -Value "$assetHash  $($asset.Name)" -Encoding ASCII
          $env:OPENCOVE_STANDALONE_ASSET = $asset.FullName
          $env:OPENCOVE_STANDALONE_CHECKSUMS_FILE = $checksumFile
          $env:OPENCOVE_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'opencove-standalone'
          $env:OPENCOVE_BIN_DIR = Join-Path $env:RUNNER_TEMP 'opencove-bin'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-assets/opencove-install.ps1
          & (Join-Path $env:OPENCOVE_BIN_DIR 'opencove.cmd') worker start --help
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-assets/opencove-install.ps1 -Uninstall

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            !dist/opencove-server-*.tar.gz
            !dist/opencove-server-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload updater metadata
        if: ${{ matrix.upload_updater_metadata }}
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.artifact_name }}-updater-metadata
          path: |
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone server bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.artifact_name }}-standalone
          path: |
            dist/opencove-server-*.tar.gz
            dist/opencove-server-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
    permissions:
      contents: write

    steps:
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${OPENCOVE_RELEASE_TAG}" == *"-nightly."* ]]; then
            echo "is_nightly=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Nightly ${OPENCOVE_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "is_nightly=false" >> "$GITHUB_OUTPUT"
            echo "release_name=${OPENCOVE_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OPENCOVE_RELEASE_TARGET }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Align package version with release tag
        run: node scripts/apply-ci-release-version.mjs "${{ env.OPENCOVE_RELEASE_TAG }}"

      - name: Generate release manifest
        run: node scripts/generate-release-manifest.mjs

      - name: Generate managed SSH installer assets
        run: node scripts/generate-release-installer-assets.mjs release-assets

      - name: Verify managed SSH installer assets
        shell: bash
        run: |
          set -euo pipefail
          test -s "release-assets/opencove-install-${OPENCOVE_RELEASE_TAG}.sh"
          test -s "release-assets/opencove-install-${OPENCOVE_RELEASE_TAG}.ps1"
          test -s "release-assets/opencove-uninstall-${OPENCOVE_RELEASE_TAG}.sh"
          test -s "release-assets/opencove-uninstall-${OPENCOVE_RELEASE_TAG}.ps1"
          if [[ "${OPENCOVE_RELEASE_TAG}" != *"-nightly."* ]]; then
            test -s release-assets/opencove-install.sh
            test -s release-assets/opencove-install.ps1
            test -s release-assets/opencove-uninstall.sh
            test -s release-assets/opencove-uninstall.ps1
          fi

      - name: Generate checksums
        run: node scripts/generate-checksums.mjs release-assets

      - name: Stage release assets as a prerelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.OPENCOVE_RELEASE_TAG }}
          target_commitish: ${{ env.OPENCOVE_RELEASE_TARGET }}
          name: ${{ steps.channel.outputs.release_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-assets/*
            release/release-manifest.json

  verify-published-standalone:
    name: Verify Published Standalone (${{ matrix.label }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
          - label: macOS Intel
            runner: macos-15-intel
          - label: Windows
            runner: windows-2022
          - label: Linux
            runner: ubuntu-latest

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OPENCOVE_RELEASE_TARGET }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download, install, and start the tag-pinned Worker
        run: node scripts/smoke-published-standalone-runtime.mjs "${{ env.OPENCOVE_RELEASE_TAG }}"

  promote-stable:
    name: Promote Verified Stable Release
    needs: [publish, verify-published-standalone]
    if: ${{ success() && !contains(inputs.tag_name || github.ref_name, '-nightly.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the verified prerelease to latest stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$OPENCOVE_RELEASE_TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"

  verify-latest-stable:
    name: Verify Latest Stable Download
    needs: promote-stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OPENCOVE_RELEASE_TARGET }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download, install, and start through the latest-stable path
        run: node scripts/smoke-published-standalone-runtime.mjs "${{ env.OPENCOVE_RELEASE_TAG }}" --installer-source=latest
