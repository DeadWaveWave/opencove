name: Nightly (Scheduled)

on:
  schedule:
    # 04:00 Asia/Shanghai = 20:00 UTC (previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build nightly artifacts without publishing a GitHub release
        required: false
        type: boolean
        default: true
      target_ref:
        description: Branch, tag, or SHA to package (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: write
  # Reads the CI runs on main to find the newest green commit.
  actions: read

concurrency:
  group: nightly-scheduled
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Nightly Tag
    runs-on: ubuntu-latest
    env:
      OPENCOVE_NIGHTLY_TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      previous_tag: ${{ steps.gate.outputs.previous_tag }}
      has_changes: ${{ steps.gate.outputs.has_changes }}
      reason: ${{ steps.gate.outputs.reason }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      target_commitish: ${{ steps.sha.outputs.target_commitish }}
    steps:
      # A scheduled nightly is built from the head commit of the newest successful push run of CI
      # on main, never from a newer commit. Manual dispatch skips this step and builds the
      # requested ref as before.
      - name: Resolve newest green CI commit
        id: green
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Newest green push run of CI on main: ${sha:-none}"

      # The decision is made by the scripts of this workflow's own revision: the head of the
      # default ref (main for a scheduled run) is checked out first, and the green commit only
      # after the gate said release.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OPENCOVE_NIGHTLY_TARGET_REF }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve checked-out head
        id: head
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve nightly release gate
        id: gate
        run: |
          node scripts/resolve-nightly-release-gate.mjs \
            --event "${{ github.event_name }}" \
            --target "${{ steps.head.outputs.sha }}" \
            --green-commit "${{ steps.green.outputs.sha }}" \
            --head "${{ steps.head.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Report skipped nightly release
        if: steps.gate.outputs.should_release != 'true'
        run: |
          echo "Skipping nightly release; green commit: ${{ steps.green.outputs.sha || 'none' }}, head: ${{ steps.head.outputs.sha }}."
          echo "reason=${{ steps.gate.outputs.reason }}"
          echo "previous_tag=${{ steps.gate.outputs.previous_tag }}"
          echo "has_changes=${{ steps.gate.outputs.has_changes }}"

      - name: Check out the green commit
        if: github.event_name == 'schedule' && steps.gate.outputs.should_release == 'true'
        run: git checkout --detach "${{ steps.green.outputs.sha }}"

      - name: Resolve target commit-ish
        id: sha
        if: steps.gate.outputs.should_release == 'true'
        run: |
          echo "target_commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve nightly tag
        id: tag
        if: steps.gate.outputs.should_release == 'true'
        run: |
          TAG_NAME="$(node scripts/resolve-nightly-tag.mjs)"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  release:
    name: Release Nightly
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target_commitish: ${{ needs.resolve.outputs.target_commitish }}
