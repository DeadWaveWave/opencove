name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check

      - name: Unit tests (PR)
        if: github.event_name == 'pull_request'
        run: pnpm test -- --run

      - name: Unit tests with coverage (main)
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Terminal recovery native contracts
        run: pnpm test:terminal-recovery:native

      - name: Build
        run: pnpm build

      - name: Upload coverage artifact
        if: github.event_name == 'push' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/swift || true
          df -h

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: E2E tests (shard)
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" pnpm test:e2e -- --shard=${{ matrix.shard }}/3 --max-failures=2

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-ubuntu-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7

      - name: Cleanup E2E temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-e2e" || true; fi
          rm -rf "/tmp/opencove-e2e" || true
          rm -rf "/tmp/cove-e2e-user-data-"* || true

  web-canvas-continuity-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift || true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Web Canvas browsers
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      - name: Chromium continuity tests
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: >-
          pnpm test:e2e:web-canvas --
          tests/e2e-web-canvas/workerWebCanvas.terminal-auto-calibration.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.terminal-live-reattach-geometry.spec.ts
          --project=chromium --retries=0

      - name: WebKit calibration test
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: >-
          pnpm test:e2e:web-canvas --
          tests/e2e-web-canvas/workerWebCanvas.terminal-auto-calibration.spec.ts
          --project=webkit --retries=0

      - name: Upload Web Canvas artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-web-canvas
          path: |
            test-results-web-canvas/
            playwright-report-web-canvas/
          retention-days: 7

      - name: Cleanup Web Canvas temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-web-canvas" || true; fi
          rm -rf "/tmp/opencove-web-canvas" || true

  ci-macos:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: E2E tests (shard)
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-macos-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7

      - name: Cleanup E2E temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-e2e" || true; fi
          rm -rf "/tmp/opencove-e2e" || true
          rm -rf "/tmp/cove-e2e-user-data-"* || true

  platform-e2e-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Windows-specific E2E tests
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_TEST_MATCH: '**/*.windows.spec.ts'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows-platform-e2e
          path: test-results/
          retention-days: 7
