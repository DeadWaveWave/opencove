name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run, macOS shards included, can be started by hand on a branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are superseded. A run on main is never cancelled: one runs, the newest
  # waits, and an older waiting one is dropped, so each run covers every merge since the last.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository checks
        run: pnpm verify:repo

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Architecture harness tests
        run: pnpm arch:test

      - name: Typecheck
        run: pnpm check

      - name: E2E case budget
        run: pnpm e2e:budget

      - name: E2E shard plans
        run: node scripts/plan-e2e-shards.mjs --check

      - name: Unit tests (PR)
        # Pull requests and manual runs; pushes run the same files under coverage below.
        if: github.event_name != 'push'
        run: pnpm test -- --run

      - name: Unit tests with coverage (main)
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Terminal recovery native contracts
        run: pnpm test:terminal-recovery:native

      - name: Build
        run: pnpm build

      - name: Real Worker and built CLI contracts
        run: pnpm test:contract:worker-cli

      - name: Upload coverage artifact
        if: github.event_name == 'push' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Playwright 1.58 cannot install browser dependencies on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/swift || true
          df -h

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Desktop/Web continuity E2E
        # apt mirrors occasionally stall; fail fast instead of burning the 6h job limit.
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E tests (shard)
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
          OPENCOVE_E2E_JSON_REPORT: artifacts/e2e-durations/ubuntu-${{ matrix.shard }}.json
        run: xvfb-run -a -s "-screen 0 1600x1200x24" node scripts/plan-e2e-shards.mjs --os ubuntu --shards 3 --shard ${{ matrix.shard }} --run --max-failures=2

      - name: Upload E2E durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-ubuntu-${{ matrix.shard }}
          path: artifacts/e2e-durations/ubuntu-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-ubuntu-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7

      - name: Cleanup E2E temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-e2e" || true; fi
          rm -rf "/tmp/opencove-e2e" || true
          rm -rf "/tmp/cove-e2e-user-data-"* || true

  web-canvas-continuity-ubuntu:
    # Playwright 1.58 cannot install browser dependencies on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift || true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Web Canvas browsers
        # apt mirrors occasionally stall; fail fast instead of burning the 6h job limit.
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build
        id: build
        run: pnpm build

      - name: Web canvas tests (chromium)
        # No spec paths: the config's testDir selects the whole directory, so a new spec cannot be left out.
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: pnpm test:e2e:web-canvas -- --project=chromium --retries=0

      # WebKit subset: these files measure text metrics and theme colours, where WebKit differs from Chromium. The other files have never been run on WebKit.
      - name: WebKit calibration and theme tests
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: >-
          pnpm test:e2e:web-canvas --
          tests/e2e-web-canvas/workerWebCanvas.terminal-auto-calibration.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.themes.spec.ts
          --project=webkit --retries=0

      - name: Web shell tests (chromium)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        timeout-minutes: 10
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: pnpm test:e2e:web-shell -- --retries=0

      - name: Upload Web Canvas artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-web-canvas
          path: |
            test-results-web-canvas/
            playwright-report-web-canvas/
            test-results-web-shell/
            playwright-report-web-shell/
          retention-days: 7

      - name: Cleanup Web Canvas temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-web-canvas" || true; fi
          rm -rf "/tmp/opencove-web-canvas" || true

  # The only macOS job of a pull request run: the Worker CLI contracts, the macOS-only files and
  # the core E2E group. The full macOS E2E runs after the merge (ci-macos).
  macos-platform:
    name: macOS platform (Worker CLI contracts, macOS-only and core E2E)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Real Worker and built CLI contracts
        run: pnpm test:contract:worker-cli
      # Every Vitest file whose name carries the .mac.spec. suffix runs here, selected by the name
      # pattern, so a new file needs no edit to this workflow.
      - name: macOS-only Vitest files
        run: pnpm exec vitest run --pool=forks --maxWorkers=1 ".mac.spec."
      # The files are selected by scripts/run-macos-platform-e2e.mjs: every tracked macOS-only E2E
      # file plus the core group of the quick gate. None of them needs the Playwright Chromium
      # browser (they launch Electron), so there is no browser install here.
      - name: macOS-only and core E2E files
        timeout-minutes: 20
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
        run: node scripts/run-macos-platform-e2e.mjs
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-platform
          path: test-results/
          retention-days: 7

  ci-macos:
    # The full macOS E2E runs after the merge and on request, not on pull requests.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Desktop/Web continuity E2E
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: E2E tests (shard)
        # Temporary until the restructure brings normal shards to <=25 minutes; then restore 45.
        timeout-minutes: 60
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          # One retry after the merge: a test that passes on it is reported as flaky.
          OPENCOVE_E2E_RETRIES: '1'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
          OPENCOVE_E2E_JSON_REPORT: artifacts/e2e-durations/macos-${{ matrix.shard }}.json
        run: node scripts/plan-e2e-shards.mjs --os macos --shards 3 --shard ${{ matrix.shard }} --run

      - name: Upload E2E durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-macos-${{ matrix.shard }}
          path: artifacts/e2e-durations/macos-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-macos-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7

      - name: Cleanup E2E temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-e2e" || true; fi
          rm -rf "/tmp/opencove-e2e" || true
          rm -rf "/tmp/cove-e2e-user-data-"* || true

  e2e-duration-summary:
    needs: [e2e-ubuntu, ci-macos]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download E2E durations
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-durations-*
          path: artifacts/e2e-durations
          merge-multiple: true

      - name: Summarize E2E durations
        if: always()
        run: node scripts/report-e2e-durations.mjs artifacts/e2e-durations

  platform-e2e-windows:
    # pnpm 9's node-gyp requires VS 2022 for the node-pty source build.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every Vitest file whose name carries the .windows.spec. suffix runs here, selected by the
      # name pattern, so a new file needs no edit to this list. The one exclusion is the file that
      # has its own Electron and WSL step below:
      # Verify native PowerShell and WSL argument boundaries
      # Any other exclusion must cite an issue number in this comment.
      - name: Windows-only Vitest files
        run: pnpm exec vitest run --pool=forks --maxWorkers=1 ".windows.spec." --exclude tests/integration/terminal/windowsNativeArguments.windows.spec.ts

      # This file is cross-platform, not Windows-only, so the pattern above does not select it.
      # Ubuntu already runs it in the full suite; this step is extra coverage on Windows, not its
      # only run.
      - name: Execute provider Hook relays with sanitized environments
        run: pnpm exec vitest run tests/integration/agentHookRelay.spec.ts --pool=forks --maxWorkers=1

      - name: Prepare WSL guest for native argument tests
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/prepare-wsl-native-arguments.ps1

      - name: Verify native PowerShell and WSL argument boundaries
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: ./node_modules/electron/dist/electron.exe ./node_modules/vitest/vitest.mjs run tests/integration/terminal/windowsNativeArguments.windows.spec.ts --pool=forks --maxWorkers=1

      - name: Remove CI-owned WSL guest
        timeout-minutes: 2
        if: always()
        shell: pwsh
        run: ./scripts/remove-wsl-native-arguments.ps1

      - name: Build
        run: pnpm build

      - name: Windows-specific E2E tests
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_TEST_MATCH: '**/*.windows.spec.ts,**/agent.initial-prompt-argv.spec.ts,**/runtime-diagnostics.renderer-crash.spec.ts'
          OPENCOVE_E2E_WINDOW_MODE: inactive
          OPENCOVE_E2E_RETRIES: '0'
          OPENCOVE_E2E_DISABLE_CRASH_FALLBACK: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows-platform-e2e
          path: test-results/
          retention-days: 7

  # Reports the state of a push run to the ci-red issue. It waits for every job, whatever their
  # result, so that a red run is reported and a green one closes the issue.
  main-status:
    needs:
      [
        ci-ubuntu,
        e2e-ubuntu,
        web-canvas-continuity-ubuntu,
        macos-platform,
        ci-macos,
        platform-e2e-windows,
      ]
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Report the state of main to the ci-red issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The result of every job above, from the needs context: success, failure, cancelled or skipped.
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/report-main-ci-status.mjs
